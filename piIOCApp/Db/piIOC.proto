#Terminator = CR LF;
Terminator = LF;
#Terminator=CR;
ReplyTimeout=1000;
ReadTimeout=1000;
#
#       Protocols
#
##
#       Discard Extra Inputs
#	IF NECESSARY
##
#ExtraInput = Ignore;
getModel {
	out "VER?";
#	in "%15c";
	in "%s %s";
}
getError {
	out "\$1 ERR?";
#	in "%d %d %d";
	in "%s %s %s";
}
#getMoving {
#        out "\$1 ONT? \$2";
#        in "%d %d %d=%d";
##	in "%s %s %2c%s";
#}
getMoving {
       out "\$1 SRG? \$2 1";
#      in "%d %d %d %d=%s";
       in "%#s";
}
getStatus {
	out "\$1 SVO? \$2";
	in "%d %d %d=%d";
#	in "%s %s %2c%s";
}
setStatus {
        out "\$1 SVO \$2 %b";
#        in "%d %d %d=%d";
}
getPos {
	out "\$1 POS? \$2";
	in "%d %d %d=%f";
}
setMovAbs {
	out "\$1 MOV \$2 %f";
}
setMovRel {
        out "\$1 MVR \$2 %f";
}
setHoming {
	out "\$1 \$3 \$2";
}
setStop {
	out "\$1 HLT \$2";
}
#getLim {
#	out "\$1 SRG? \$2 1";
##	in "%d %d %d %d=%s";
#	in "%#s";
#}
getVel {
	out "\$1 VEL? \$2";
	in "%d %d %d=%f";
}
setVel {
	out "\$1 VEL \$2 %f";
}
